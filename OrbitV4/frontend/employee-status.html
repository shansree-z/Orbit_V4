<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Status - Onboarding Concierge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/dashboard.html" class="navbar-brand">🚀 Onboarding Concierge</a>
            <div class="navbar-menu">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/new-employee.html">New Employee</a>
            </div>
            <div class="navbar-user">
                <div>
                    <div style="font-size: 12px; color: var(--light-text);">Logged in as</div>
                    <div style="font-weight: 600;" id="user-email"></div>
                    <div style="font-size: 11px; color: var(--light-text);" id="user-role"></div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <div style="margin-bottom: 20px;">
                <a href="/dashboard.html" style="color: var(--primary-color); text-decoration: none;">← Back to Dashboard</a>
            </div>

            <!-- Employee Info Card -->
            <div class="card mb-30" id="employee-info-container">
                <div class="spinner-center"><div class="spinner"></div></div>
            </div>

            <!-- Progress Section -->
            <div class="card mb-30" id="progress-container">
                <div class="spinner-center"><div class="spinner"></div></div>
            </div>

            <!-- Tasks Timeline -->
            <div class="card mb-30" id="tasks-container">
                <div class="spinner-center"><div class="spinner"></div></div>
            </div>

            <!-- Execution Logs -->
            <div class="card" id="logs-container">
                <div class="card-header">
                    <h2 class="card-title">Execution Logs</h2>
                </div>
                <div id="logs-content" style="max-height: 400px; overflow-y: auto;">
                    <div style="padding: 20px; text-align: center; color: var(--light-text);">Loading logs...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        function logout() {
            clearSession();
        }

        let employeeId = null;
        let refreshInterval = null;

        async function loadEmployeeStatus() {
            try {
                const status = await employeeAPI.getStatus(employeeId);

                // Employee Info
                const infoHtml = `
                    <div class="card-header">
                        <div>
                            <h2 class="card-title">${status.name}</h2>
                            <p style="color: var(--light-text); margin-top: 5px;">${status.email}</p>
                        </div>
                        <div style="text-align: right;">
                            ${getStatusBadge(status.onboarding_status)}
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                        <div>
                            <div style="color: var(--light-text); font-size: 12px; margin-bottom: 5px;">Employee ID</div>
                            <div style="font-weight: 600;">${status.employee_id}</div>
                        </div>
                        <div>
                            <div style="color: var(--light-text); font-size: 12px; margin-bottom: 5px;">Department</div>
                            <div style="font-weight: 600;">${status.department}</div>
                        </div>
                        <div>
                            <div style="color: var(--light-text); font-size: 12px; margin-bottom: 5px;">Designation</div>
                            <div style="font-weight: 600;">${status.designation}</div>
                        </div>
                        <div>
                            <div style="color: var(--light-text); font-size: 12px; margin-bottom: 5px;">Joining Date</div>
                            <div style="font-weight: 600;">${status.joining_date}</div>
                        </div>
                    </div>
                `;
                document.getElementById('employee-info-container').innerHTML = infoHtml;

                // Progress
                const progressHtml = `
                    <div class="card-header">
                        <h2 class="card-title">Onboarding Progress</h2>
                    </div>
                    <div style="padding: 20px 0;">
                        <div class="progress-container">
                            <div class="progress-label">
                                <span>Tasks Completed: ${status.tasks_completed} of ${status.total_tasks}</span>
                                <span style="font-weight: 700; color: var(--primary-color);">${status.progress}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${status.progress}%; background-color: ${status.progress === 100 ? 'var(--success-color)' : status.progress > 0 ? 'var(--warning-color)' : 'var(--border-color)'};">
                                    ${status.progress > 10 ? status.progress + '%' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('progress-container').innerHTML = progressHtml;

                // Tasks Timeline
                const tasksHtml = `
                    <div class="card-header">
                        <h2 class="card-title">Onboarding Tasks</h2>
                    </div>
                    <div class="timeline">
                        ${status.tasks.map((task, index) => {
                            const timelineClass = task.status === 'completed' ? 'completed' : 
                                                 task.status === 'failed' ? 'failed' : 
                                                 task.status === 'running' ? 'running' : 'pending';
                            
                            return `
                                <div class="timeline-item ${timelineClass}">
                                    <div class="timeline-dot"></div>
                                    <div class="timeline-content">
                                        <div class="timeline-task">${index + 1}. ${task.task_name}</div>
                                        ${task.status === 'completed' ? 
                                            `<div class="timeline-time">✓ Completed at ${formatDateTime(task.completed_at)}</div>` : 
                                          task.status === 'failed' ?
                                            `<div class="timeline-error">✗ Failed: ${task.error_message}</div>
                                             <button class="btn btn-sm btn-warning mt-20" onclick="retryTask('${task.task_name}')">Retry Task</button>` :
                                          task.status === 'running' ?
                                            `<div class="timeline-time">⏳ In Progress since ${formatDateTime(task.started_at)}</div>` :
                                            `<div class="timeline-time">⏸ Pending</div>`
                                        }
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                document.getElementById('tasks-container').innerHTML = tasksHtml;

                // Auto-refresh if still onboarding
                if (status.onboarding_status === 'onboarding' || status.onboarding_status === 'partial') {
                    if (!refreshInterval) {
                        refreshInterval = setInterval(loadEmployeeStatus, 2000);
                    }
                } else {
                    if (refreshInterval) {
                        clearInterval(refreshInterval);
                        refreshInterval = null;
                    }
                }
            } catch (error) {
                console.error('Error loading status:', error);
                showAlert('Error loading employee status', 'error');
            }
        }

        async function retryTask(taskName) {
            if (!confirm(`Retry task: "${taskName}"?`)) return;

            try {
                const result = await employeeAPI.retryTask(employeeId, taskName);
                
                if (result.success) {
                    showAlert(`Task "${taskName}" retry started`, 'success');
                } else {
                    showAlert(`Task retry failed: ${result.error}`, 'error');
                }
                
                // Reload status after 1 second
                setTimeout(loadEmployeeStatus, 1000);
            } catch (error) {
                showAlert('Error retrying task: ' + error.message, 'error');
            }
        }

        // Get employee ID from URL
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            employeeId = params.get('id');

            if (!employeeId) {
                showAlert('No employee ID provided', 'error');
                setTimeout(() => window.location.href = '/dashboard.html', 2000);
                return;
            }

            initializeNavbar();
            loadEmployeeStatus();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
