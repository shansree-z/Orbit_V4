<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Onboarding Concierge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/dashboard.html" class="navbar-brand">🚀 Onboarding Concierge</a>
            <div class="navbar-menu">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/new-employee.html">New Employee</a>
            </div>
            <div class="navbar-user">
                <div>
                    <div style="font-size: 12px; color: var(--light-text);">Logged in as</div>
                    <div style="font-weight: 600;" id="user-email"></div>
                    <div style="font-size: 11px; color: var(--light-text);" id="user-role"></div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">Dashboard</h1>
                <p class="page-subtitle">Welcome to the Onboarding Management System</p>
            </div>

            <!-- Stats Grid -->
            <div class="dashboard-grid" id="stats-container">
                <div class="stat-card">
                    <div class="stat-label">Total Employees</div>
                    <div class="stat-value" id="total-employees">-</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-label">Active Onboarding</div>
                    <div class="stat-value" id="active-onboarding">-</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">Completed Onboardings</div>
                    <div class="stat-value" id="completed-onboarding">-</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-label">Failed Tasks</div>
                    <div class="stat-value" id="failed-tasks">-</div>
                </div>
            </div>

            <!-- Recent Activity Section -->
            <div class="card mb-30">
                <div class="card-header">
                    <h2 class="card-title">Recent Activity</h2>
                    <button class="btn btn-sm btn-secondary" onclick="loadDashboardData()">Refresh</button>
                </div>
                <div id="activity-container" style="max-height: 400px; overflow-y: auto;">
                    <div class="spinner-center"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Onboarding List -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Employee Onboarding Status</h2>
                </div>
                <div class="table-container" id="employees-container">
                    <div class="spinner-center"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        function logout() {
            clearSession();
        }

        async function loadDashboardData() {
            try {
                initializeNavbar();

                // Load stats
                const stats = await dashboardAPI.getStats();
                
                document.getElementById('total-employees').textContent = stats.total_employees;
                document.getElementById('active-onboarding').textContent = stats.active_onboarding;
                document.getElementById('completed-onboarding').textContent = stats.completed_onboarding;
                document.getElementById('failed-tasks').textContent = stats.failed_tasks_count;

                // Load recent activities
                const activityHtml = stats.recent_activities.length > 0 
                    ? stats.recent_activities.map(activity => `
                        <div style="padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong style="display: block; margin-bottom: 4px;">${activity.employee_id}</strong>
                                <span style="color: var(--light-text); font-size: 13px;">${activity.action}</span>
                            </div>
                            <span style="color: var(--light-text); font-size: 12px;">${formatDateTime(activity.timestamp)}</span>
                        </div>
                    `).join('')
                    : '<div style="padding: 20px; text-align: center; color: var(--light-text);">No recent activities</div>';
                
                document.getElementById('activity-container').innerHTML = activityHtml;

                // Load employees list
                const employeeData = await dashboardAPI.getOnboardingList();
                
                const tableHtml = employeeData.employees.length > 0
                    ? `
                        <table>
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th>Status</th>
                                    <th>Progress</th>
                                    <th>Tasks</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${employeeData.employees.map(emp => `
                                    <tr>
                                        <td>${emp.employee_id}</td>
                                        <td>${emp.name}</td>
                                        <td>${emp.department}</td>
                                        <td>${getStatusBadge(emp.onboarding_status)}</td>
                                        <td>
                                            <div class="progress-bar">
                                                <div class="progress-fill" style="width: ${emp.progress}%; background-color: ${emp.progress === 100 ? 'var(--success-color)' : emp.progress > 0 ? 'var(--warning-color)' : 'var(--border-color)'};">
                                                    ${emp.progress}%
                                                </div>
                                            </div>
                                        </td>
                                        <td><strong>${emp.completed_tasks}</strong>/${emp.total_tasks}</td>
                                        <td>
                                            <a href="/employee-status.html?id=${emp.employee_id}" class="btn btn-sm btn-primary">View</a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `
                    : '<div style="padding: 40px; text-align: center; color: var(--light-text);">No employees created yet</div>';
                
                document.getElementById('employees-container').innerHTML = tableHtml;
            } catch (error) {
                showAlert('Error loading dashboard data: ' + error.message, 'error');
                console.error('Dashboard error:', error);
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            // Refresh every 5 seconds
            setInterval(loadDashboardData, 5000);
        });
    </script>
</body>
</html>
