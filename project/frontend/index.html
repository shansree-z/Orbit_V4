<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - New-Hire Onboarding Concierge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🚀</div>
                <h1 class="login-title">Onboarding Concierge</h1>
                <p class="login-subtitle">Employee Onboarding Management System</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Select Your Role</label>
                    <div class="role-selector">
                        <div class="role-option active" id="hr-role">
                            <input type="radio" name="role" value="hr" checked>
                            <div style="font-size: 24px; margin-bottom: 8px;">👥</div>
                            <div style="font-weight: 600;">HR Admin</div>
                        </div>
                        <div class="role-option" id="manager-role">
                            <input type="radio" name="role" value="manager">
                            <div style="font-size: 24px; margin-bottom: 8px;">📊</div>
                            <div style="font-weight: 600;">Manager</div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="login-error" style="display: none;" class="alert alert-error"></div>

                <button type="submit" class="btn btn-primary btn-block mb-20">Sign In</button>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

                <div style="text-align: center; font-size: 12px; color: var(--light-text);">
                    <p><strong>Demo Credentials:</strong></p>
                    <p style="margin: 5px 0;">
                        HR: <code>hr@company.com / Hr@123</code>
                    </p>
                    <p style="margin: 5px 0;">
                        Manager: <code>manager@company.com / Manager@123</code>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        // Role selector UI
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                this.querySelector('input').checked = true;
            });
        });

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const errorDiv = document.getElementById('login-error');

            try {
                errorDiv.style.display = 'none';
                
                const response = await authAPI.login(email, password, role);
                
                setToken(response.access_token);
                setUser({
                    email: response.email,
                    role: response.role,
                });

                // Redirect based on role
                if (response.role === 'hr') {
                    window.location.href = '/dashboard.html';
                } else {
                    window.location.href = '/manager-monitoring.html';
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
