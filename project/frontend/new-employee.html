<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Employee - Onboarding Concierge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/dashboard.html" class="navbar-brand">🚀 Onboarding Concierge</a>
            <div class="navbar-menu">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/new-employee.html">New Employee</a>
            </div>
            <div class="navbar-user">
                <div>
                    <div style="font-size: 12px; color: var(--light-text);">Logged in as</div>
                    <div style="font-weight: 600;" id="user-email"></div>
                    <div style="font-size: 11px; color: var(--light-text);" id="user-role"></div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="page-container">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">Create New Employee</h1>
                <p class="page-subtitle">Register a new employee to start their onboarding process</p>
            </div>

            <!-- Employee Form -->
            <div style="max-width: 600px; margin: 0 auto;">
                <div class="card">
                    <form id="employee-form" onsubmit="handleCreateEmployee(event)">
                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                placeholder="John Doe"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="employee_id">Employee ID *</label>
                            <input 
                                type="text" 
                                id="employee_id" 
                                name="employee_id" 
                                placeholder="EMP001"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="john.doe@example.com"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="department">Department *</label>
                            <select id="department" name="department" required>
                                <option value="">Select Department</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Sales">Sales</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Finance">Finance</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="designation">Designation *</label>
                            <select id="designation" name="designation" required>
                                <option value="">Select Designation</option>
                                <option value="Senior Engineer">Senior Engineer</option>
                                <option value="Software Engineer">Software Engineer</option>
                                <option value="Product Manager">Product Manager</option>
                                <option value="Sales Manager">Sales Manager</option>
                                <option value="Marketing Specialist">Marketing Specialist</option>
                                <option value="HR Manager">HR Manager</option>
                                <option value="Finance Analyst">Finance Analyst</option>
                                <option value="Operations Manager">Operations Manager</option>
                                <option value="Intern">Intern</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="joining_date">Joining Date *</label>
                            <input 
                                type="date" 
                                id="joining_date" 
                                name="joining_date"
                                required
                            >
                        </div>

                        <div id="form-message" style="display: none; margin-bottom: 20px;"></div>

                        <div style="display: flex; gap: 10px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1;">Create Employee</button>
                            <button type="reset" class="btn btn-secondary" style="flex: 1;">Clear Form</button>
                        </div>
                    </form>
                </div>

                <!-- Success Modal -->
                <div id="success-modal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2 class="modal-title">Employee Created Successfully! ✓</h2>
                        </div>
                        <div class="modal-body">
                            <p id="success-message"></p>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" onclick="startOnboarding()">Start Onboarding</button>
                            <button class="btn btn-secondary" onclick="resetForm()">Create Another</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script>
        function logout() {
            clearSession();
        }

        let currentEmployeeId = null;

        async function handleCreateEmployee(event) {
            event.preventDefault();

            const employee = {
                name: document.getElementById('name').value,
                employee_id: document.getElementById('employee_id').value,
                email: document.getElementById('email').value,
                department: document.getElementById('department').value,
                designation: document.getElementById('designation').value,
                joining_date: document.getElementById('joining_date').value,
            };

            const messageDiv = document.getElementById('form-message');

            try {
                messageDiv.style.display = 'none';
                messageDiv.classList.remove('alert-success', 'alert-error');

                const response = await employeeAPI.create(employee);
                
                currentEmployeeId = response.employee_id;
                document.getElementById('success-message').textContent = 
                    `${employee.name} has been created successfully. You can now start the onboarding process.`;
                
                document.getElementById('success-modal').classList.add('active');
            } catch (error) {
                messageDiv.classList.add('alert', 'alert-error');
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.style.display = 'block';
            }
        }

        async function startOnboarding() {
            if (!currentEmployeeId) return;

            try {
                await employeeAPI.startOnboarding(currentEmployeeId);
                window.location.href = `/employee-status.html?id=${currentEmployeeId}`;
            } catch (error) {
                showAlert('Error starting onboarding: ' + error.message, 'error');
            }
        }

        function resetForm() {
            document.getElementById('employee-form').reset();
            document.getElementById('success-modal').classList.remove('active');
            currentEmployeeId = null;
        }

        // Set today's date as default
        document.addEventListener('DOMContentLoaded', () => {
            initializeNavbar();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('joining_date').value = today;
        });
    </script>
</body>
</html>
